name: Build GlasBG-AI APK

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: 

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Extract project
    run: |
      unzip -q GlasBG-AI-Android-Project-v0.2.0.zip -d source
      find source -name settings.gradle.kts
      test -f source/LiveDubBG/settings.gradle.kts

  - name: Build debug APK
    working-directory: source/LiveDubBG
    run: gradle assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: GlasBG-AI-debug-APK
      path: source/LiveDubBG/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
